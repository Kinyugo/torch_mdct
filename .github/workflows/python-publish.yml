# Publishes the package to PyPI when a GitHub release is published.
#
# Release process:
#   1. Update CHANGELOG.md and merge to main.
#   2. Create a GitHub release with a tag of the form `vX.Y.Z` (e.g. `v0.5.0`).
#   3. This workflow runs the test suite, builds the distribution from that tag
#      (hatch-vcs derives the version from the tag), verifies the built version
#      matches the tag, and uploads to PyPI via trusted publishing.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[test]
      - name: Run tests
        run: pytest

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify built version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.whl | sed -E 's|.*/torch_mdct-([^-]+)-.*|\1|')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Release tag v$tag does not match built version $built. Tag the release as vX.Y.Z."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Uses PyPI trusted publishing (OIDC): PyPI is configured to trust this
    # repository, this workflow file, and the `pypi` environment, so no API
    # token secret is needed.
    environment:
      name: pypi
      url: https://pypi.org/project/torch_mdct/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
